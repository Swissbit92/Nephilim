version: '3.8'

# =============================================================================
# MCP Coordinator - SQLite Edition (Optimized for Local Personal Use)
# =============================================================================
# This setup uses SQLite for simplicity and performance in single-user scenarios.
# All data persists in ./data/ directory on your host machine.
#
# For production/multi-user deployments, consider PostgreSQL for multi-user deployments
# =============================================================================

services:
  # Ollama LLM server
  ollama:
    image: ollama/ollama:latest
    container_name: ai-companion-brain
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    # NOTE (macOS/Apple Silicon): run Ollama NATIVELY (`ollama serve`) for Metal GPU
    # acceleration — Docker on Mac has no GPU passthrough, so this containerized service
    # would run CPU-only. For Linux/NVIDIA hosts, re-add a `deploy.resources.reservations`
    # GPU block and `- OLLAMA_FLASH_ATTENTION=true` above.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mcp-network
    restart: unless-stopped

  # Backend FastAPI server
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-companion-api
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      # Ollama configuration
      # macOS: point at native Ollama (Metal) via host.docker.internal. For an
      # all-Docker Linux deployment, set OLLAMA_BASE=http://ollama:11434.
      OLLAMA_BASE: ${OLLAMA_BASE:-http://host.docker.internal:11434}
      # `:?` not `:-` — a shell-level fallback here would silently reintroduce the
      # wrong-model bug one layer above the application, which has deliberately
      # removed its own default. Compose fails to start with this message instead.
      PERSONA_MODEL: ${PERSONA_MODEL:?PERSONA_MODEL must be set (no fallback model — see config/llm.py)}
      PERSONA_TEMPERATURE: ${PERSONA_TEMPERATURE:-0.9}

      # Server configuration
      COORD_PORT: 8000
      COORD_URL: http://backend:8000
      PERSONA_DIR: personas

      # Database (SQLite - stored in ./data/ on host)
      COORDINATOR_DB_PATH: /app/data/chats.db

      # Brave MCP (optional - requires API key)
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      BRAVE_MAX_RESULTS: ${BRAVE_MAX_RESULTS:-5}
      BRAVE_MCP_URL: http://brave-mcp:8080  # HTTP transport to MCP service


      # Authentication (Google OAuth + JWT)
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      AUTH_ENV: ${AUTH_ENV:-development}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set (min 32 chars) — no insecure default}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-1}
      JWT_REFRESH_EXPIRE_DAYS: ${JWT_REFRESH_EXPIRE_DAYS:-30}

      # Jupiter / Solana Wallet (optional)
      JUPITER_ENABLED: ${JUPITER_ENABLED:-false}
      JUPITER_MCP_IMAGE: ${JUPITER_MCP_IMAGE:-localhost/jupiter-mcp:latest}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      JUPITER_SLIPPAGE_BPS: ${JUPITER_SLIPPAGE_BPS:-50}
      JUPITER_TIMEOUT: ${JUPITER_TIMEOUT:-30}
      STRATEGIES_DIR: strategies

      # Email Trade Notifications (optional)
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-smtp.gmail.com}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TO: ${EMAIL_TO:-}

      # Memory & RAG settings
      MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-nomic-embed-text:latest}
      MEMORY_SUMMARIZATION_INTERVAL: ${MEMORY_SUMMARIZATION_INTERVAL:-30}
      MEMORY_FACT_EXTRACTION_INTERVAL: ${MEMORY_FACT_EXTRACTION_INTERVAL:-10}
    volumes:
      # SQLite database - persists all chat data
      # Location: ./data/chats.db on your host machine
      - ./data:/app/data

      # Persona CV summaries cache - auto-generated
      - ./personas/_summaries:/app/personas/_summaries

      # Application logs (optional)
      - ./logs:/app/logs

      # Persona definitions (read-only)
      - ./personas:/app/personas:ro

      # Strategy definitions for Jupiter autonomous trading
      - ./strategies:/app/strategies

      # Docker socket - enables backend to spawn ephemeral MCP containers
      # This is the standard pattern for container orchestration (like CI/CD runners)
      #
      # SECURITY MEASURES (Jan 2026):
      # - All spawned containers have resource limits (memory, CPU, PID limits)
      # - Containers labeled for orphan detection and cleanup
      # - Guaranteed cleanup on timeout/error with graceful termination
      # - Run scripts/cleanup_orphan_containers.py periodically to detect leaks
      #
      # Resource limits applied:
      # - Brave MCP (ephemeral): 256MB RAM, 0.5 CPU, 100 PIDs max
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mcp-network
    restart: unless-stopped

  # Frontend React app
  frontend:
    build:
      context: ./react-ui
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_BASE_URL=http://localhost:8000
        - REACT_APP_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    container_name: ai-companion-web
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mcp-network
    restart: unless-stopped

  # =============================================================================
  # MCP Services (Brave Search)
  # =============================================================================
  # No longer run as long-lived services in docker-compose.
  #
  # Using ephemeral container pattern: backend spawns `docker run -i --rm` on-demand
  # - Brave MCP: New container per search (2-3s lifecycle)
  #
  # SECURITY (Jan 2026):
  # All MCP containers have resource limits to prevent DoS attacks:
  # - Memory limits (256MB)
  # - CPU limits (0.5 cores)
  # - PID limits (100 max)
  # - Container labels for orphan detection
  #
  # See:
  # - src/coordinator/mcp_client_stdio.py (Brave MCP)
  # - scripts/cleanup_orphan_containers.py (orphan cleanup)

volumes:
  # Ollama models storage (can be large - 4-10GB per model)
  # Persists across container restarts
  ollama_models:
    driver: local

networks:
  mcp-network:
    driver: bridge
