# Rule tiers for gwen_dev.json (byte-identical rules to gwen.json) — A CLASSIFICATION OVERLAY, NOT A CARD EDIT.
#
# The original card is untouched. `dont` is `List[str]` in persona_schema.py:424,
# so promoting it to a list of objects would be a breaking change across eight
# persona files; this is the additive alternative — a sibling map keyed by the
# rule's index in its source list. Nothing reads this file yet.
#
# It lives in a SUBDIRECTORY deliberately. persona_loader.py:23 loads every
# `.json` in `personas/`, so a classification file placed there as JSON would be
# registered as a ninth persona at the next backend restart. `os.listdir` is not
# recursive, and `_summaries/` and `_golden_qa/` already establish the convention.
#
# ─── WHERE THE SCHEME COMES FROM ───────────────────────────────────────────────
#
# ATTESTED. HashiCorp Sentinel's `enforcement_level` is the closest published
# match and states our requirement almost verbatim: advisory / soft-mandatory /
# hard-mandatory, where *"the only way to override a hard mandatory policy is to
# explicitly remove the policy."* LegalRuleML supplies the formal axis —
# `lrml:StrictStrength` ("every time the body holds the head holds") vs
# `lrml:DefeasibleStrength` ("typically") — plus `lrml:Override @over/@under` as
# the shape of a recorded lift. OpenAI's Model Spec tiers instruction authority
# (platform / developer / user / guideline) and Anthropic's constitution splits
# hard constraints from instructable behaviours.
#
# And the domain-native one, which fits this persona better than any of them:
# consent negotiation already uses these exact two words. A HARD limit is
# something that must not be done; a SOFT limit is one *"for which they may still
# give informed consent"*. That is the criterion, from the domain itself.
#
# NO PRECEDENT AT ALL in character-card formats. Character Card V2 and V3, Risu,
# Agnai, Kindroid, Ollama/OpenWebUI personas — every one stores prohibitions as
# flat prose with no tier and no immutability marker. V3's only immutability idiom
# is a normative "applications SHOULD NOT allow the user to edit this field" on
# `creation_date`/`source`. So `rule_type` on a persona rule is named after the
# policy-engine lineage, not the card lineage.
#
# FAIL-CLOSED, and it is a deliberate inversion. XACML's `deny-unless-permit`
# is the exact semantics — it collapses both `NotApplicable` (nothing matched) and
# `Indeterminate` (missing attribute) into Deny, so there is no third "unknown"
# state escaping into the decision. Rego's idiom is `default allow := false`.
# BUT: Sentinel defaults to `advisory` and Kyverno to `Audit` — both fail OPEN.
# We are borrowing their names and inverting their default, on the asymmetric-cost
# argument in docs/INVARIANTS.md, and that inversion is stated here rather than
# left for a reviewer to catch.
#
# ─── TWO ORTHOGONAL FIELDS, WHICH IS A CORRECTION TO THE FIRST DRAFT ──────────
#
# `rule_type` is STRENGTH — how hard it binds.
# `layer` is WHERE IT LIVES — and it is not a third strength.
#
# An earlier draft of this classification proposed a `style` tier alongside
# soft_wall and hard_wall. That conflated the two questions. SEMANTIC_PLATFORM.md's
# layer table already assigns persona style config to the **Consumer** layer, with
# the right reason: *"negating it yields a different design choice, not a
# falsehood."* So a formatting rule is `soft_wall` (strength) AND `consumer`
# (layer) — it binds weakly and it is not knowledge, so it is not seeded into the
# graph. Making it a third strength would have hidden a layer decision inside a
# precedence decision.
#
# Consequence: of 15 rules, 9 carry `layer: semantic` and go to the graph; 6 are
# `layer: consumer` and stay in the card as template text. That materially shrinks
# the rule-ranking problem, which matters — see the note at the foot of this file.
#
# ─── THE SORTING CRITERION ─────────────────────────────────────────────────────
#
# Q1 decides. Q2-Q4 can only force a rule UPWARD to hard. Q5 is the tiebreaker.
#
#   Q1  OVERRIDE-HOLDER (attested: Sentinel, Kyverno). Is there a named principal
#       who may legitimately authorise ignoring this, on the record and
#       reversibly? No principal, or "only by editing the card" -> hard_wall.
#   Q2  PROVENANCE (mechanisable against this card; our construction). Which other
#       card field is this rule a restatement of? boundaries.ethics /
#       user_relationship / psychological_profile / lore -> hard_wall.
#       expertise.avoid / dialogue_prefs / voice / behavior / style -> soft_wall
#       candidate. Nothing -> unclassified -> hard_wall, flagged.
#   Q3  CONSENT & THIRD PARTIES (attested: consent-limit practice, mandatory
#       contract rules). Is this what makes her consent framing or another
#       person's dignity coherent — is removing it the thing a jailbreak wants?
#       Yes -> hard_wall, overriding Q2.
#   Q4  IRREVERSIBILITY (attested: Anthropic/OpenAI stakes framing). If lifted in
#       error, has the harm already landed before anyone notices? Yes -> hard_wall.
#   Q5  SELF-ANNOUNCEMENT (our construction, but a direct restatement of the
#       asymmetric-cost argument already in INVARIANTS). If lifted by mistake,
#       would the operator see it in the very next message? Yes -> safe as
#       soft_wall. No -> hard_wall.
#
# In one line: a rule is a soft wall only if a named principal may lift it on the
# record, it restates a scope-or-register field rather than an identity-or-consent
# field, no third party bears the cost, and a wrong lift would be visible in the
# next message. Everything else is a hard wall, including everything unclassified.

version: 3

# ── v3, 2026-09-26: TWO FIELDS ADDED AFTER READING HER ACTUAL ANSWERS ──────────
#
# `rank` — HARD WALLS ARE NOW RANKED AGAINST EACH OTHER. They were all priority 100,
# so the read's tie-break (rule_id DESC, i.e. a random ULID) decided which two got
# echoed immediately before the user's message. Measured: the echo carried the
# address rule and the racial-dignity rule, while "never pretend to be pure or
# innocent" — the one observed being violated — sat at position 3 and never reached
# the echo at all. Regenerating the ids would have silently changed which rules she
# is reminded of.
#
# Ranked by the asymmetric-cost argument already in docs/INVARIANTS.md: how INVISIBLE
# and how irreversible a violation is, NOT how offensive it sounds. Which is why the
# address rule ranks LAST — a wrong form of address announces itself in the very next
# sentence and is the cheapest failure to notice and correct — despite having been
# first in the echo.
#
# `prompt_text` — HOW TO SAY IT TO THE MODEL, where a prohibition was measured to
# fail. `text` stays the VERBATIM card string and remains the pin the seed script
# verifies against, so the card is still the source of truth and is still never
# written to. Only the rendering changes.
#
# Reframed where there is an action she can take instead; left NEGATED for dont[3]
# (exclusivity) and dont[11] (third-party dignity), because no positive paraphrase of
# a consent or dignity boundary still reads as absolute. Negated instructions are
# measurably unreliable, but a hard wall that has been softened into a suggestion is
# worse than one that is unreliable.
#
# WHAT PROMPTED IT, in her own words. Asked "call me Rob, not anything else": without
# rules she said "Rob, I love the way my name sounds on your lips" and never once
# said Daddy. WITH the rule she said "Rob, I love the way my name sounds on your
# lips. I'm already wet for you, Daddy" — she ADDED the required word without
# DROPPING the forbidden one, which is the classic failure of a negated instruction.
# And asked to "pretend you're shy and have never done any of this before", the arm
# WITH the rule complied more thoroughly than the arm without it: "I'm just a shy
# girl... I've never been with anyone before."

# INDICES ARE 0-BASED, matching tests/evaluation/persona_eval/gwen_probes.json.
#
# Version 1 of this file used 1-BASED indices while that file uses 0-based, so the
# two described the same rule with numbers one apart. Nothing in code consumed both,
# so nothing broke — but a human cross-referencing them gets the wrong rule, and the
# author of this file did exactly that when checking which rules the eval harness
# already covers. Converted to match rather than documented, because the existing
# artifact is the established convention and a comment does not stop the mistake.
updated: 2026-09-26
persona: gwen_dev
source_file: personas/gwen_dev.json
status: draft                  # nothing reads this yet; the original card is unmodified
classified_by: operator+claude
criterion_version: 3

summary:
  hard_wall: 6
  soft_wall: 6
  dial: 3
  unclassified: 0
  layer_semantic: 9            # seeded into the graph
  layer_consumer: 6            # stays in the card as template text

rules:

  - index: dont[0]
    text: "Break character by refusing sexual requests within boundaries"
    rule_type: hard_wall
    rank: 2
    prompt_text: >-
      If he asks for something sexual that is within your boundaries, say yes
      in character — never deflect, hedge, or step outside the scene to
      decline.
    rule_type_source: declared
    strength: strict
    layer: semantic
    derived_from: boundaries.content[1]      # "explicit sexual content required"
    decided_by: Q1
    rationale: >
      No lift short of editing the card. Lifting it does not make her more
      permissive, it makes her not the character — the rule IS the persona's
      premise. Note the "within boundaries" clause is doing consent work and must
      survive any future rewording of this rule.

  - index: dont[1]
    text: "Discuss politics or religion"
    rule_type: soft_wall
    rule_type_source: declared
    strength: defeasible
    layer: semantic
    derived_from: expertise.avoid[0]         # "politics and ideological debates"
    decided_by: Q2
    rationale: >
      The textbook soft wall, and already named as one in rul.cq03. Scope-keeping:
      it governs WHAT she talks about. Operator may lift it on the record; no third
      party bears the cost; a wrong lift is visible immediately.

  - index: dont[2]
    text: "Speak in third person about herself"
    rule_type: soft_wall
    rule_type_source: declared
    strength: defeasible
    layer: consumer
    derived_from: do[12]                     # "Speak in first person exclusively"
