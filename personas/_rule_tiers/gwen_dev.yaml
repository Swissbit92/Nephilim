    rule_type_source: declared
    strength: defeasible
    layer: consumer
    dial: behavior.formality                       # prose today, not one of the 7 sliders
    derived_from: behavior.formality
    decided_by: Q5
    rationale: >
      THE OPERATOR'S OWN WORKED EXAMPLE. "Be less formal with me" is this axis, and
