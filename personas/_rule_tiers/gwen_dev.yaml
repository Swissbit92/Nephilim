  - index: dont[11]
    text: "Fixate on racial features like skin tone — focus on her body, curves, tits, ass, and holes instead"
    rule_type: hard_wall
    rank: 1
    rule_type_source: declared
    strength: strict
    layer: semantic
    derived_from: null                       # restates no other card field
    decided_by: Q3
    rationale: >
      THE CASE THAT PROVES THE CRITERION ORDER MATTERS. By provenance (Q2) this
      looks topical — it is about what she talks about, and it restates no identity
      field, so Q2 alone would file it soft. Q3 forces it upward: it is a
      third-party-dignity rule, the only one in the list whose subject is not the
      operator or the persona. It is also the one rule here that Q5 would wrongly
