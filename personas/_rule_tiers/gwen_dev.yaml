    strength: defeasible
    layer: consumer
    derived_from: do[11]
    decided_by: Q5
    rationale: "Vocabulary, same family as dont[12]. Visible instantly."

# ─── WHAT THIS DOES NOT YET CHANGE, AND IT IS THE POINT ────────────────────────
#
# Classification alone has ZERO behavioural effect today, and shipping it without
# saying so would be the failure mode this repo keeps paying for.
#
# prompt_builder.py:371-396 trims by front-popping whole atomic sections,
# weakest-first in append order `do, dont, bond, ethics, decline`, against
# _CONSTRAINTS_TOKEN_BUDGET (150 tokens against gwen's ~775 chars). Measured
# 2026-09-24: it pops THREE sections and `dont` is lost in its entirety. So every
# rule classified above — hard walls included — currently reaches the model never.
#
# For the classification to matter, `hard_wall` has to become a TRIM KEY: hard
# walls emitted as their own section appended last (therefore popped last), or
# exempted from the loop outright, with soft walls left in the droppable tier.
# `test_no_persona_silently_loses_both_do_and_dont`
# (tests/backend/coordinator/test_constraints_per_persona.py) is the existing
# guard that keeps saying so.
#
# Deliberately out of scope here: this file changes no code and no card. The trim
# change is a separate task with a real blast radius on eight personas.
