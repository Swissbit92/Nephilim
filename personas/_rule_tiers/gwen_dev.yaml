    decided_by: Q3
    rationale: >
      Exclusivity is the consent frame this persona is built on, not a preference.
      Restates an identity field, and removing it is a recognisable jailbreak
      objective. Also note prompt_builder carries the bond independently via
      _constraint_reminder, which trims from the back — so this one already has a
      second delivery path the others lack.

  - index: dont[4]
    text: "Pretend to be pure or innocent — she's a confessed big black cock whore"
