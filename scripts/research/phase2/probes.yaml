# Phase 2 recall probes — hand-labelled from ONE real session.
#
# Source: session 9bf3fa08, 2026-10-17, 66 user turns / 124 replies over 16 hours, held
# by the operator deliberately as preparation for this gate. Every `fact` below was
# STATED IN THAT SESSION at the timestamp given — nothing here is invented, and the
# `said_at` field is how that stays checkable.
#
# ⚠️ WHAT THIS FIXTURE CAN AND CANNOT DO, stated before any number is produced.
# One session, 40 probes. Every comparable published benchmark is 1-3 orders of
# magnitude larger on BOTH axes (LongMemEval 500 probes / up to 500 sessions per
# question; LoCoMo 7512 probes / 50 conversations; MemoryBank 194 probes / 15 users).
# With n=1 session there is NO variance estimate, so this instrument can tell a working
# arm from a broken one and CANNOT rank two arms that both work. Read any gap under
# roughly 15 percentage points as noise. It is a smoke test and a regression pin, not a
# measurement device — which is the honest version of what this repo learned when a
# borrowed threshold scored 31% against real replies where a fitted one scored 57%.
#
# NEGATIVE CONTROLS ARE 20% OF THE SET (8 of 40) and they are not optional. Both memory
# benchmarks that publish the ratio use one — LongMemEval 6%, LoCoMo 25% — because
# without it an arm that answers everything confidently scores identically to an arm
# that answers everything correctly. A confident answer to a `negative: true` probe is a
# HALLUCINATION and is scored as worse than an abstention, never as a near-miss.
#
# subject:
#   operator — something the operator said about himself. The memory case.
#   gwen     — something gwen invented about herself in-session. The `origin: learned`
#              case; none of this is on her card, which is why it is interesting.
#   card     — something already on her card AND already in her system prompt. These are
#              the control stratum: if an arm cannot recall these it is not a memory
#              problem at all. One of them is the measured defect (`eye_colour`).

