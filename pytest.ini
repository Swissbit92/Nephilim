[pytest]
# Pytest configuration for MCP Coordinator

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Minimum version
minversion = 7.0

# Output options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Strict config (fail on config issues)
    --strict-config
    # Warnings
    -W ignore::DeprecationWarning
    -W ignore::PendingDeprecationWarning
    # ADR-014: a leaked Neo4j driver must FAIL a test, not pass quietly.
    # Driver 6.x removed implicit close from __del__; all that remains is a
    # ResourceWarning — and ResourceWarning is in Python's DEFAULT IGNORE LIST.
    # So an unclosed driver produces no error, no log and no warning, just
    # orphaned sockets and threads for the life of the process. In 5.x the GC
    # silently covered for you; it no longer does. This one line is the entire
    # cost of catching it.
    -W error::ResourceWarning
    # Show slowest tests
    --durations=10
    # Coverage reporting (enabled by default)
    --cov=src/coordinator
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=60
    # Short traceback format
    --tb=short
    # Fail fast on first error (optional, commented out by default)
    # -x
    # Stop after N failures (optional, commented out by default)
    # --maxfail=3

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    e2e: marks tests as end-to-end tests
    requires_api_key: marks tests that need API keys (Brave, MongoDB)
    requires_docker: marks tests that need Docker running
    requires_ollama: marks tests that need Ollama running
    evaluation: marks tests for RAGAS evaluation
    performance: marks tests that measure performance

# Coverage options
[coverage:run]
source = src
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */venv/*
    */node_modules/*

[coverage:report]
# Regexes for lines to exclude from consideration
exclude_lines =
    # Have to re-enable the standard pragma
    pragma: no cover
    # Don't complain about missing debug-only code:
    def __repr__
    # Don't complain if tests don't hit defensive assertion code:
    raise AssertionError
    raise NotImplementedError
    # Don't complain if non-runnable code isn't run:
    if 0:
    if False:
    if __name__ == .__main__.:
    # Don't complain about abstract methods
    @abstractmethod
    @abc.abstractmethod
    # Don't complain about type checking blocks
    if TYPE_CHECKING:

precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
